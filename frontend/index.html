<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaani — Your AI Workspace</title><meta name="theme-color" content="#0e0a10">
<link rel="stylesheet" href="./styles.css?v=14">
</head>
<body>
<div id="scene" class="scene model-saturn">
  <div class="nebula nebula-a"></div><div class="nebula nebula-b"></div>
  <div class="stars stars-a"></div><div class="stars stars-b"></div><div class="stars stars-c"></div>
  <div class="star-field" id="starField"></div>
  <div class="planet-system system-a" aria-hidden="true"><div class="orbit orbit-a"></div><div class="planet planet-a"></div></div>
  <div class="planet-system system-b" aria-hidden="true"><div class="orbit orbit-b"></div><div class="planet planet-b"></div></div>
  <div class="planet-system system-c" aria-hidden="true"><div class="orbit orbit-c"></div><div class="planet planet-c"></div></div>
  <div class="planet-system system-d" aria-hidden="true"><div class="orbit orbit-d"></div><div class="planet planet-d"></div></div>

  <header class="topbar">
    <button class="brand" id="brandBtn" aria-label="New Vaani chat">
      <span class="brand-mark"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.18)"/><path d="M11 10L23.7 36L37 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="37" cy="10" r="2.4" fill="#fff"/></svg></span>
      <span class="brand-copy"><strong>Vaani</strong><small>Your AI Workspace</small></span>
    </button>
    <div class="top-actions">
      <div class="live-pill"><i></i><div><b id="liveTime">--:--:--</b><small id="liveDate">--</small></div><span id="liveWeather">Live</span></div>
      <div class="mode-wrap"><button class="ghost-btn top-nav-btn" id="modeBtn" aria-haspopup="true" aria-expanded="false"><span class="btn-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></span><span id="modeText">General</span><span class="mode-arrow" aria-hidden="true" style="margin-left:2px;">⌄</span></button><div class="popover mode-menu" id="modeMenu" role="menu"></div></div>
      <div class="model-wrap"><button class="model-btn" id="modelBtn"><span class="model-dot"></span><span><b id="modelName">Saturn</b><small id="modelTag" aria-hidden="true"></small></span><em>⌄</em></button><button class="model-info-btn" id="modelInfoBtn" title="Model Guide" aria-label="Model Guide">i</button><div class="popover model-menu" id="modelMenu"></div></div>
      <button class="ghost-btn top-nav-btn" id="historyBtn" aria-label="Chat History"><span class="btn-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span>History</span></button><button class="ghost-btn top-nav-btn" id="newChatBtn" aria-label="New chat"><span class="btn-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span><span>New chat</span></button>
      <button class="ghost-btn top-nav-btn" id="toolsBtn" aria-label="Tools"><span class="btn-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><span>Tools</span></button><button class="ghost-btn top-nav-btn" id="devBtn" aria-label="Developer"><span class="btn-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m8 10 3 2-3 2"/><path d="M13 14h3"/></svg></span><span>Developer</span></button>
      <button class="icon-btn" id="commandBtn" title="Command palette (Ctrl+K)" aria-label="Command palette"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg></button>
    </div>
  </header>

  <main class="main">
    <section class="hero" id="hero">
      <div class="hero-logo">
        <div class="hero-v-wrap"><div class="hero-v-orbit hero-v-orbit-a"></div><div class="hero-v-orbit hero-v-orbit-b"></div>
          <svg class="hero-v" viewBox="0 0 180 180"><defs><filter id="heroGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="90" cy="90" r="67" fill="none" stroke="rgba(255,255,255,.12)"/><circle cx="90" cy="90" r="55" fill="rgba(255,255,255,.018)" stroke="rgba(255,255,255,.18)"/><path d="M49 43L89 132L132 43" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#heroGlow)"/><path d="M62 44L90 105L119 44" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round"/><circle cx="132" cy="43" r="5" fill="#fff"/><circle cx="49" cy="43" r="3.5" fill="#fff"/></svg>
        </div><div class="hero-name">V A A N I</div><div class="hero-sub">YOUR AI WORKSPACE</div>
      </div>
      <div class="hero-copy"><h1 id="heroTitle">Let’s build something.</h1><p>Ask, learn, create, solve — in one calm workspace.</p></div>
      <div class="suggestions"><button data-prompt="Good morning Vaani, give me my daily briefing for today">🌅 Morning Briefing</button><button data-prompt="Aaj ka main focus aur priorities kya honi chahiye?">🎯 Daily Focus</button><button data-prompt="Plan a 3-day trip to Goa">✈️ Plan something</button><button data-prompt="Explain JWT in simple words">💡 Learn something</button><button data-prompt="Help me build a Python REST API">⚡ Build something</button><button data-prompt="Research useful current topics to explore">🔍 Research</button></div>
      <div class="composer hero-composer"><div class="composer-attachments" id="heroAttachments" aria-live="polite"></div><div class="composer-row"><button class="attach-btn" id="attachBtn" aria-label="Add photos and files">＋</button><button class="voice-btn" id="voiceBtn" title="Voice input" aria-label="Voice input"><span class="mic-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path><path d="M9 21h6"></path></svg></span></button><input id="promptInput" autocomplete="off" placeholder="What are you working on?"/><button class="send-btn" id="sendBtn" aria-label="Send message">↑</button></div><input type="file" id="fileInput" hidden multiple accept="image/png,image/jpeg,image/webp,image/jpg,.txt,.md,.csv,.tsv,.json,.py,.js,.ts,.jsx,.tsx,.html,.css,.java,.cpp,.c,.h,.hpp,.cs,.go,.rs,.php,.sql,.xml,.yaml,.yml,.sh,.bat,.ps1,.pdf,.docx,.xlsx,.xlsm,.xls"></div>
      <div class="creator-signature">JITENDRA VERMA <span>—</span> THE MIND BEHIND VAANI <span class="live-dots" aria-hidden="true">...</span></div><div class="voice-status" id="voiceStatus"></div><div class="disclaimer">Vaani can make mistakes. Verify important information.</div>
    </section>

    <section class="chat-shell" id="chatShell" aria-hidden="true">
      <div class="chat-toolbar"><span id="chatContext">General · Saturn</span><div class="toolbar-right"><span id="latencyBadge" class="latency">Ready</span><button id="focusBtn" aria-pressed="false">Focus</button><button id="exportChatBtn" title="Export conversation as Markdown" aria-label="Export conversation">Export</button><button id="stopBtn" disabled>Stop</button></div></div>
      <div class="chat-scroll" id="chatScroll"><div class="messages" id="messages"></div></div>
      <div class="composer chat-composer"><div class="composer-attachments" id="chatAttachments" aria-live="polite"></div><div class="composer-row"><button class="attach-btn" id="chatAttachBtn" aria-label="Add photos and files">＋</button><button class="voice-btn" id="chatVoiceBtn" aria-label="Voice input"><span class="mic-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path><path d="M9 21h6"></path></svg></span></button><textarea id="chatInput" rows="1" placeholder="Continue the conversation…"></textarea><button class="send-btn" id="chatSendBtn" aria-label="Send message">↑</button></div><input type="file" id="chatFileInput" hidden multiple accept="image/png,image/jpeg,image/webp,image/jpg,.txt,.md,.csv,.tsv,.json,.py,.js,.ts,.jsx,.tsx,.html,.css,.java,.cpp,.c,.h,.hpp,.cs,.go,.rs,.php,.sql,.xml,.yaml,.yml,.sh,.bat,.ps1,.pdf,.docx,.xlsx,.xlsm,.xls"></div>
    </section>
  </main>

  <aside class="drawer" id="drawer"><div class="drawer-head"><h3 id="drawerTitle">Tools</h3><button class="close-btn" id="drawerClose">×</button></div><div class="drawer-body" id="drawerBody"></div></aside>
  <div class="command-palette" id="commandPalette"><div class="command-card"><div class="command-head"><strong>VAANI QUICK ACCESS</strong><button class="command-close" id="commandClose" aria-label="Close">×</button></div><div class="command-search"><span class="cmd-icon-wrap" style="display:inline-flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg></span><input id="commandInput" placeholder="Search Vaani…"></div><div id="commandList"></div></div></div>
  <div class="plus-menu" id="plusMenu" aria-hidden="true"></div><div class="backdrop" id="backdrop"></div><div class="toast" id="toast"></div><div class="file-chip" id="fileChip" aria-hidden="true"></div><div class="image-lightbox" id="imageLightbox" aria-hidden="true"><button class="lightbox-close" id="imageLightboxClose" aria-label="Close image preview">×</button><img id="imageLightboxImg" alt="Expanded attachment preview"><div class="lightbox-name" id="imageLightboxName"></div></div>
</div>
<script src="./app.js?v=14"></script>
</body></html>
